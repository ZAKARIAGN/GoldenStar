services:

  api-gateway:
    build: ./api-gateway
    ports:
      - "5000:5000"
    depends_on:
      - auth-service
      - menu-service
      - combo-service
    volumes:
      - ./api-gateway:/app
      - /app/node_modules
    command: npm run dev

  auth-service:
    build: ./auth-service
    ports:
      - "5001:5001"
    volumes:
      - ./auth-service:/app
      - /app/node_modules
    command: npm run dev

  combo-service:
    build: ./combo-service
    ports:
      - "5003:5003"
    volumes:
      - ./combo-service:/app
      - /app/node_modules
    command: npm run dev

  menu-service:
    build: ./menu-service
    ports:
      - "5002:5002"
    volumes:
      - ./menu-service:/app
      - /app/node_modules
    command: npm run dev