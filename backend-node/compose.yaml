services:

  api-gateway:
    build: ./api-gateway
    ports:
      - "5000:5000"
    depends_on:
      - auth-service
      - menu-service
      - combo-service
      - order-service
    command: npm run dev

  auth-service:
    build: ./auth-service
    ports:
      - "5001:5001"
    command: npm run dev

  combo-service:
    build: ./combo-service
    ports:
      - "5003:5003"
    command: npm run dev

  menu-service:
    build: ./menu-service
    ports:
      - "5002:5002"
    command: npm run dev

  order-service:
    build: ./order-service
    ports:
      - "5004:5004"
    command: npm run dev
